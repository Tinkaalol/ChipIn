services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: subscriptions
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d subscriptions"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: alembic upgrade head
    environment: &db_env
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/subscriptions
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: .
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    environment: *db_env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  bot:
    build: .
    command: python -m bot.main
    environment:
      <<: *db_env
      BOT_TOKEN: ${BOT_TOKEN:?укажите BOT_TOKEN в .env}
      ADMIN_IDS: ${ADMIN_IDS:-}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
